name: AoV Daily Monitor

on:
  schedule:
    # 每天 UTC 08:30 (台北時間 16:30) 執行；避開 Pacific midnight RPD reset 前的舊配額窗口
    - cron: '30 8 * * *'
  # 允許在 GitHub 網頁上手動點擊執行
  workflow_dispatch:
    inputs:
      strict_doctor:
        description: "Run strict system doctor gate (require production)"
        required: false
        default: "false"

concurrency:
  group: aov-daily-monitor
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-22.04

    # 賦予 GitHub Actions 推送 Commit 的權限 (讓 hot-deployer 生效)
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # 取出完整歷史紀錄以利後續的 Git 操作
          fetch-depth: 0
          
      - name: 🐍 Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 若爬蟲需要 playwright 瀏覽器核心，可在此安裝
          python -m playwright install chromium

      - name: 🔧 Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔐 LLM Secret Preflight (Advisory)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY configured"; else echo "::warning::GEMINI_API_KEY missing"; fi
          if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY configured"; else echo "::warning::OPENAI_API_KEY missing"; fi
          # P105.1：切 OpenRouter 首發後這把 key 才是雲端 daily 主力，缺則退回 gemini（可能斷糧）
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY configured"; else echo "::warning::OPENROUTER_API_KEY missing — 雲端會退回 gemini"; fi

      - name: 🚀 Execute AoV Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # P105.1 切 OpenRouter 首發：key 走 secret（機敏）；鏈與額度非機敏故寫明於此（改鏈/調額度改這兩行）
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROVIDER_CHAIN: "openrouter:deepseek/deepseek-chat, openrouter:deepseek/deepseek-r1, gemini"
          OPENROUTER_MODEL_BUDGETS: "deepseek/deepseek-chat:80000, deepseek/deepseek-r1:20000"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: ${{ secrets.PAGES_URL }}
        # 執行主程式的 --run-now 模式，這會觸發：搜集 → 分析 → 報告 → 推播 → 備份 Push
        run: |
          python main.py --run-now

      - name: 📦 Upload Enrichment Queue Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-queue-${{ github.run_id }}
          path: data/enrichment_queue/
          if-no-files-found: ignore
          retention-days: 3

      - name: 🩹 Self-Heal Missing Report (P111)
        # 偵測 canonical 報告意外缺漏 → 自動 replay 重產 candidate(promote=False) → 過與 cron 逐位元同源的
        # 發布閘門（should_promote + run_checks）→ 通過才 promote 發布；不通過則 no-op + ::warning:: 降級 L4。
        # 窄面：只重渲染既有 analysis，零 LLM、零重爬、不繞品質閘門（不可能發布 cron 本不發布的報告）。
        # 不加 if:always()：僅在前序步驟正常時才補救（pipeline 硬崩潰不在此自癒）。置 Fallback Push 前讓重產報告隨之入版控。
        run: |
          REPORT_DATE="$(TZ=Asia/Taipei date +'%Y-%m-%d')"
          python scripts/replay_run.py --date "$REPORT_DATE" --heal-if-missing --check-health || echo "::warning::self-heal failed, staying L4"

      - name: 🔐 Secret Scan (Advisory, P115)
        # bot 自動 commit（Fallback Push）前的 CI 端機敏掃描——補本機 pre-push hook 涵蓋不到的 bot 路徑（R-029 殘留邊界）。
        # advisory：偵測到疑似外洩印 ::error:: 顯著告警，但不阻斷日報（避免誤判讓報告斷供；本機 pre-push 仍為硬閘）。
        if: always()
        continue-on-error: true
        run: |
          python -m gov.scan_secrets || echo "::error::secret scan 偵測到疑似機敏外洩——請查 Actions log，bot push 已含此內容，必要時清洗+輪替金鑰"

      - name: 🛠️ Fallback Push
        # 如果 python main.py 裡面的 Git push 失敗，這裡補推一次
        if: always()
        run: |
          git add data/reports/ data/runs/ data/llm_cache.json index.html || true
          git diff --cached --quiet || git commit -m "docs: 戰略報告自動同步 (Fallback) $(date +'%Y-%m-%d')"
          git push || true

      - name: 🛡️ Preflight CI Profile (P117 統一總指揮)
        # P117：把原本散落的 4 個 post-pipeline 報告檢查（health/system_doctor/freshness/slo）
        # 收斂成 gov.preflight 一鍵 ci profile（CI 與本地同源、一張總表、blocking/warning 分級 + 防遞迴）。
        # 全 warning 級 + continue-on-error → advisory 不阻斷日報（對齊原 4 step 的 continue-on-error 行為）。
        # checker 清單見 governance_config.yaml profiles.ci；報告類靠 checker taipei_today() 預設取今日（跨平台）。
        if: always()
        continue-on-error: true
        run: |
          python -m gov.preflight --profile ci

      - name: 🩺 System Doctor (Strict Gate)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.strict_doctor == 'true' }}
        run: |
          REPORT_DATE="$(TZ=Asia/Taipei date +'%Y-%m-%d')"
          python scripts/system_doctor.py \
            --repo-root . \
            --date "$REPORT_DATE" \
            --profile ci \
            --require-production

      - name: 📲 Failure Alert (P115)
        # pipeline 真崩潰（非 advisory/continue-on-error 的步驟失敗）時主動推播，否則阿喜只能自己開 Actions UI 才知道。
        # 沿用既有 daily 報告推播的 TELEGRAM 授權邊界（同一頻道、僅失敗時、不新增 secret）。continue-on-error 防告警本身再炸。
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ AoV daily pipeline 今日失敗，請查 GitHub Actions run ${{ github.run_id }}" || true
          else
            echo "::warning::pipeline 失敗但 TELEGRAM secrets 未設，無法推播告警"
          fi
