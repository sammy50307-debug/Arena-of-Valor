# Keyword Stopwords (P106.1) — 熱詞統計專用停用詞庫
#
# 用途：
#   keyword_stats 熱詞榜統計時，這些詞即使高頻也【不】列入熱詞榜。
#
# 為什麼獨立一個檔（不塞進 personal_blacklist.yaml）：
#   personal_blacklist.yaml 同時是 top5_picker 的「文章黑名單」——
#   標題/內文 contains 任一詞就整篇排除。若把「傳說」「分享」等平台/通用詞
#   加進去，picker 會誤殺幾乎所有文章 → 報告變空（P106 陷阱 1）。
#   故熱詞停用詞獨立此檔，【只】影響熱詞榜，【不】影響 picker 文章篩選。
#
# 比對規則：
#   完全比對 jieba 切出的單一詞（word == stopword），非 contains。
#   芽芽相關熱度照常統計（熱詞榜本就該反映芽芽討論度）。
#
# 主公新增詞時直接加到 stopwords 下方即可。

stopwords:
  # ── 平台 / 站名 ──
  - 巴哈姆特
  - 巴哈姆   # P108：jieba 常把「巴哈姆特」切成「巴哈姆」+「特」，需獨立擋切殘詞
  - 巴哈
  - Dcard
  - PTT
  - 論壇
  - Instagram   # P108：平台名補齊
  - Facebook
  - Threads
  - YouTube
  - IG
  - FB
  # ── 遊戲名 / 泛稱 ──
  - 傳說對決
  - 傳說
  - AOV
  - Garena
  # ── 通用文章類型詞 ──
  - 分享
  - 心得
  - 介紹
  - 討論
  - 情報
  - 問題
  - 文章
  - 攻略
  - 決版
  - 決板
  # ── 通用無洞察詞（P108）──
  - 不能
  - 遊戲
  - 官方
