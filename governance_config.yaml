# governance_config.yaml — AOV 治理設定
# 快照日期：2026-05-31（改良自 skills-governance governance_config.yaml）
# P103：回填 GOV-PORT 融合引擎到 AOV 母本

schema_version: 0.1
status: pilot   # pilot | stable

# ── preflight 編排器 ──
# blocking 的 checker 失敗會擋住 commit/push；warning 只告警不阻擋。
# fast profile：commit 前快跑（秒級）。full profile：push 前全跑。
preflight:
  recursion_guard_env: GOV_PREFLIGHT_RUNNING
  # P117：fast=commit 前秒級；full=push 前 repo/source/治理全跑；ci=報告產後驗證（接管 daily_report.yml）。
  # 新註冊 checker 一律 python 前綴（_resolve_python 轉 sys.executable，本地 Win + CI Linux 皆可）；
  # 報告類省略 --date 靠 checker taipei_today() 預設（跨平台，無需 $(date)）。
  profiles:
    fast: [secret_scan, guard_assertions]
    full: [secret_scan, guard_assertions, governance_doctor, tests, known_issue_guard, artifact_hygiene, root_legacy, handoff_truth, no_fake_stats]
    ci: [report_health, system_doctor, report_freshness, slo]
  checks:
    secret_scan:
      run: "python -m gov.scan_secrets"
      level: blocking
      timeout: 30
    guard_assertions:
      run: "python -m gov.assertions --check"
      level: blocking
    governance_doctor:
      run: "py scripts/governance_doctor.py"
      level: warning   # AOV 既有 checker，warning 級觀察
      timeout: 60
    tests:
      run: "py -m pytest tests/ -q --tb=line"
      level: blocking
      timeout: 120
    # ── P117 新增：CI 報告產後驗證類（warning，對齊原 daily_report.yml advisory；--date 靠 checker 預設）──
    report_health:
      run: "python scripts/check_daily_report_health.py --expected-mode any --check-git-clean"
      level: warning
      timeout: 60
    system_doctor:
      run: "python scripts/system_doctor.py --repo-root . --profile local"
      level: warning
      timeout: 60
    report_freshness:
      run: "python scripts/check_report_freshness.py --reports-dir data/reports --threshold 3"
      level: warning
      timeout: 30
    slo:
      run: "python scripts/slo_checker.py --repo-root . --window-days 7"
      level: warning
      timeout: 60
    # ── P117 新增：開發 push 前 repo/source/治理類（warning，無需 date）──
    known_issue_guard:
      run: "python scripts/check_known_issue_guard_index.py --repo-root . --strict"
      level: warning
      timeout: 30
    artifact_hygiene:
      run: "python scripts/check_generated_artifact_hygiene.py --repo-root . --strict"
      level: warning
      timeout: 30
    root_legacy:
      run: "python scripts/check_root_legacy_hygiene.py --repo-root . --strict"
      level: warning
      timeout: 30
    handoff_truth:
      run: "python scripts/check_handoff_truth.py --repo-root ."
      level: warning
      timeout: 30
    no_fake_stats:
      run: "python scripts/check_no_fake_stats.py --repo-root ."
      level: warning
      timeout: 30

# ── 斷言引擎 guards ──
# status: advisory（只報告）| shadow（觀察零誤判）| strict（blocking）
# P103 所有 guard 預設 advisory / shadow，不升 strict（防翻車裝甲）。
guards:
  # P104 G1 填入。status: shadow ＝ 會評估、有覆蓋、失敗只記不阻斷（exit 0）；標的均經親自讀檔確認行號。
  # 1. 安全契約（最高）：密鑰掃描器絕不回傳金鑰真值 + allowlist 豁免機制存在
  - id: GUARD-SECRET-NO-LEAK
    status: shadow
    asserts:
      - "contains: gov/scan_secrets.py::絕不回傳/列印金鑰值"
      - "contains: gov/scan_secrets.py::allowlist-secret"
  # 2. 斷言引擎 X4-J 免責邊界存在（防過度信任啟發式 guard）
  - id: GUARD-ASSERT-DISCLAIMER
    status: shadow
    asserts:
      - "contains: gov/assertions.py::召回率僅供參考"
  # 3. preflight 防遞迴 env guard 存在（移除會導致巢狀無限迴圈）
  - id: GUARD-PREFLIGHT-RECURSION
    status: shadow
    asserts:
      - "contains: gov/preflight.py::GOV_PREFLIGHT_RUNNING"
  # 4. 斷言引擎緊急逃生艙（--allow-skip）存在
  - id: GUARD-ALLOW-SKIP-ESCAPE
    status: shadow
    asserts:
      - "contains: gov/assertions.py::allow-skip"
  # 5. 治理母本：governance_doctor + 風險登記簿存在且維持 Open/Closed 結構
  - id: GUARD-GOVERNANCE-MOTHER
    status: shadow
    asserts:
      - "exists: scripts/governance_doctor.py"
      - "exists: docs/RISK_REGISTRY.md"
      - "contains: docs/RISK_REGISTRY.md::## 已關閉風險"

# ── 密鑰掃描 patterns（Hermes 7 類 + AOV detect-secrets 聯集）──
# 注意：以下為偵測特徵 regex，非真實金鑰，可安全進版控。
secret_patterns:
  - name: "OpenAI/OpenRouter"
    regex: '\bsk-(?:or-v1-|proj-|ant-|live-)?[A-Za-z0-9]{20,}'
  - name: "Google API"
    regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
  - name: "Discord Bot Token"
    regex: '\b[MNO][A-Za-z0-9_\-]{23,}\.[A-Za-z0-9_\-]{6}\.[A-Za-z0-9_\-]{27,}'
  - name: "Discord Webhook"
    regex: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9_\-]{20,}'
  - name: "Slack Token"
    regex: '\bxox[baprs]-[A-Za-z0-9\-]{10,}'
  - name: "AWS Access Key"
    regex: '\bAKIA[0-9A-Z]{16}\b'
  - name: "PEM Private Key"
    regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
