<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaYa Tactical Hub | 傳說對決 AI 輿情監測旗艦</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary: #6366f1;
            --accent: #7c3aed;
            --cyan: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(99, 102, 241, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            background-image: radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 🌌 數據流粒子效果 (維持相容性結構) */
        .sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sakura {
            position: absolute;
            background: var(--cyan);
            border-radius: 50%;
            opacity: 0;
            filter: blur(1px);
            box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--primary);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            20% { opacity: 0.7; scale: 1; }
            80% { opacity: 0.7; scale: 1; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        /* 🌌 背景網格 (對應截圖) */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .hero-section {
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .logo-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            background: var(--primary);
            filter: blur(50px);
            opacity: 0.2;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.1; scale: 1; background: var(--primary); }
            to { opacity: 0.4; scale: 1.2; background: var(--accent); }
        }

        .zap-icon {
            width: 80px; 
            height: 80px; 
            color: var(--cyan); 
            position: relative; 
            z-index: 2;
            transform: rotate(-15deg); /* 對應截圖傾斜角度 */
            filter: drop-shadow(0 0 15px var(--cyan));
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            background: linear-gradient(to right, #fff 20%, var(--cyan) 50%, var(--primary) 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-dim);
            margin-bottom: 3.5rem;
            line-height: 1.6;
            font-weight: 300;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .main-btn {
            background: linear-gradient(135deg, #4f46e5 0%, var(--primary) 100%);
            color: white;
            padding: 1.2rem 3.5rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .main-btn:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.5);
            letter-spacing: 1px;
            border-color: var(--cyan);
        }

        .history-grid {
            margin-top: 5rem;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            backdrop-filter: blur(15px);
        }

        .history-item:hover {
            background: rgba(99, 102, 241, 0.15);
            color: var(--cyan);
            border-color: var(--cyan);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .history-grid {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                max-width: 340px;
                margin-left: auto;
                margin-right: auto;
            }
            .history-item { justify-content: center; min-height: 48px; }
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            opacity: 0.4;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(34, 211, 238, 0.08);
            color: var(--cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(34, 211, 238, 0.2);
            backdrop-filter: blur(5px);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="sakura-container" id="sakura"></div>

    <main class="hero-section">
        <div class="status-badge">
            <i data-lucide="shield-check" style="width:16px"></i>
            系統在線：數據指揮中樞已就緒
        </div>

        <div class="logo-container">
            <div class="logo-glow"></div>
            <i data-lucide="zap" class="zap-icon"></i>
        </div>

        <h1>YaYa Tactical Hub</h1>
        <p class="subtitle">
            基於 AI 的自動化輿情與活動監測系統<br>
            專為傳說對決 (AoV) 打造的統馭級戰略儀表板
        </p>

        <div class="cta-container">
            <a href="data/reports/aov_report_2026-05-01_v26.html?v=26" class="main-btn">
                進入最新戰報 (2026-05-01 v26)
                <i data-lucide="arrow-right"></i>
            </a>
        </div>

        <div class="history-grid">
            <a href="data/reports/aov_report_2026-04-30.html" class="history-item">
                <i data-lucide="history" style="width: 14px"></i>
                04/30 戰報
            </a>
            <a href="data/reports/aov_report_2026-04-29.html" class="history-item">
                <i data-lucide="history" style="width: 14px"></i>
                04/29 戰報
            </a>
            <a href="data/reports/aov_report_2026-04-28.html" class="history-item">
                <i data-lucide="history" style="width: 14px"></i>
                04/28 戰報
            </a>
            <a href="data/reports/aov_report_2026-04-27.html" class="history-item">
                <i data-lucide="history" style="width: 14px"></i>
                04/27 戰報
            </a>
            <a href="#" class="history-item" style="opacity: 0.5; cursor: default;">
                <i data-lucide="history" style="width: 14px"></i>
                — 暫無歷史報告
            </a>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 YaYa AI Strategic Team. All rights reserved.
    </footer>

    <script>
        // 🌌 初始化數據流粒子 (對應策略 C 浮升效果)
        const container = document.getElementById('sakura');
        const particleCount = 28;

        for (let i = 0; i < particleCount; i++) {
            const petal = document.createElement('div');
            petal.className = 'sakura';
            
            const size = Math.random() * 2 + 2 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            
            petal.style.animationDuration = Math.random() * 4 + 4 + 's';
            petal.style.animationDelay = Math.random() * 6 + 's';
            
            container.appendChild(petal);
        }

        lucide.createIcons();
    </script>
</body>
</html>
